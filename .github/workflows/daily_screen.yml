name: Daily Screen

on:
  schedule:
    # 21:30 UTC ~ shortly after US market close (adjust for DST as needed)
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # NOTE: fetch_prices.py, criteria.py, vcp.py, screen.py are not
      # implemented yet - this workflow is a placeholder until those
      # pieces are built.
      - name: Run screener (placeholder)
        run: echo "TODO: python src/screen.py"
